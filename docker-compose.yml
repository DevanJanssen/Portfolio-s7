services:
  postgres:
    image: postgres:15
    # 5434, niet 5432/5433: zo kan een lokale Postgres of de stofloos-template
    # nooit per ongeluk het doelwit worden van een migratie.
    ports:
      - 127.0.0.1:5434:5432
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local123
    volumes:
      - data:/var/lib/postgresql/data
    logging:
      driver: none

volumes:
  data:
